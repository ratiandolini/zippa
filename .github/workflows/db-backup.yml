name: DB Backup

# ყოველდღიური pg_dump — არტიფაქტად ინახება GitHub-ზე (90 დღე, უფასო).
# საჭიროა repo secret: DATABASE_URL (Neon-ის DIRECT_URL, არა pooled).

on:
  schedule:
    - cron: "0 3 * * *" # ყოველ დღე 03:00 UTC (07:00 თბილისში)
  workflow_dispatch: {} # ხელით გაშვებაც შესაძლებელია

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 16 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret არ არის დაყენებული"; exit 1; }
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          pg_dump --no-owner --no-privileges "$DATABASE_URL" | gzip > "zippa-$STAMP.sql.gz"
          ls -lh zippa-*.sql.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: zippa-*.sql.gz
          retention-days: 90
          if-no-files-found: error
